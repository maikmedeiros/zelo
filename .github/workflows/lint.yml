name: Linting

# TODO(ci): os SHAs das actions abaixo foram escritos sem acesso ao registry. ANTES do
# primeiro run, confirme cada digest com
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`.
# A convenção do projeto é pinar por SHA (nada de @v4): tag é mutável e permite repin
# silencioso — vetor clássico de supply chain.

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # o commitlint precisa do histórico do range

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run lint:prettier:check

      - name: ESLint
        run: npm run lint:eslint:check

      - name: Commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
