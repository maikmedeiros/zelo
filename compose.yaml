services:
  postgres:
    image: postgres:18-alpine
    container_name: zelo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${PG_USER:-zelo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-zelo}
      POSTGRES_DB: ${PG_DB_NAME:-zelo}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'

    ports:
      - '127.0.0.1:${PG_PORT:-5432}:5432'

    # As migrations NÃO são montadas no initdb: quem as aplica é o migrator da aplicação,
    # que sabe o que já rodou. Com os dois ligados, um volume novo aplicaria tudo duas vezes.
    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-zelo} -d ${PG_DB_NAME:-zelo}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:8
    container_name: zelo-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ZELO}
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'

    volumes:
      - mongodata:/data/db
      - ./db/mongo-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: zelo-pgdata
  mongodata:
    name: zelo-mongodata
